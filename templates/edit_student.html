{% extends "layout.html" %}

{% block title %}Edit Student - Student Performance Analysis System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="page-header" style="margin-bottom: 20px;">
        <div>
            <h1>Edit Student Profile</h1>
            <p class="subtitle">Update registration details for <strong>{{ student.full_name }}</strong> ({{ student.roll_no }}).</p>
        </div>
    </div>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="form-card" style="max-width: 100%;">
        <form method="POST" action="{{ url_for('edit_student', student_id=student.student_id) }}">
            <div class="form-group">
                <label for="roll_no">Roll Number <span style="color: var(--danger);">*</span></label>
                <input type="text" id="roll_no" name="roll_no" class="form-control"
                       value="{{ student.roll_no }}" required maxlength="30">
            </div>

            <div class="form-group">
                <label for="full_name">Student Full Name <span style="color: var(--danger);">*</span></label>
                <input type="text" id="full_name" name="full_name" class="form-control"
                       value="{{ student.full_name }}" required maxlength="100">
            </div>

            <div class="form-group">
                <label for="section">Class Section</label>
                <input type="text" id="section" name="section" class="form-control"
                       value="{{ student.section or '' }}" maxlength="20">
            </div>

            <div class="btn-group" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('manage_students') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
